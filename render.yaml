services:
  - type: web
    name: sumber-urip
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "Toko Sumber Urip"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: sumber-urip-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_ON_DEPLOY
        value: "true"

databases:
  - name: sumber-urip-db
    plan: free
    region: singapore
    databaseName: sumber_urip
    user: sumber_urip_user
